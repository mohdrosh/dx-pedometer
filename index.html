<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0C68B3" />
    <title>健康対策推進活動・万歩計実績表</title>
    <!-- Without these the browser asks for /favicon.ico, does not find one,
         and puts a grey globe next to 「健康対策推進活動」 in the tab. The
         mark is the company's ＰＯ monogram on white; モラエッグ swaps in
         佐野's 丹波のたまご seal at runtime, because the two are different
         sites to the person looking at the tab strip. -->
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%icon-32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="%BASE_URL%icon-512.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%icon-180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <!-- Zen Maru Gothic is the モラエッグ page's face and nothing else's: the
         rounded terminals are what make 佐野's artwork read as friendly, and
         the rest of the app stays on Inter / Noto Sans JP. Google Fonts is
         already reachable from the office network — the line above has been
         in production since the first release. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap"
      rel="stylesheet"
    />
    <style>html,body,#root{height:100%;margin:0}body{background:#F3F6F5}</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
