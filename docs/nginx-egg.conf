# ============================================================================
# モラエッグ at https://dx.morabu.com/egg
#
# 仕様書 1 (2026/11/05): the site moves out from under /pedometer/ and gets
# an address of its own. 佐野's QR code — the one going into the employee
# meeting slides on 11/14 — encodes exactly:
#
#     https://dx.morabu.com/egg
#
# with no trailing slash. So /egg itself has to answer, not only /egg/.
#
# ---------------------------------------------------------------------------
# What to do with this file
#
# On morabu-dx-app-ec2, as root, add the two locations below to the server
# block that already carries `location /pedometer/`, then:
#
#     nginx -t && systemctl reload nginx
#
# `nginx -t` first, every time: a reload with a bad config leaves the whole
# site down, and this box also serves skill-sheet and telesales.
#
# ---------------------------------------------------------------------------
# Why it is shaped like this
#
# The app is one page. Its assets live under /pedometer/assets/..., which is
# already proxied and keeps working untouched — this only has to get the
# HTML to the browser. Once index.html loads, the app reads the path, sees
# /egg and opens モラエッグ directly.
#
# The exact-match `location = /egg` is what makes the bare address work.
# Without it nginx would try /egg as a directory, fail to find one, and the
# QR would land on a 404 in front of the whole company.
# ============================================================================

# The address on the QR code. Exact match, no trailing slash.
location = /egg {
    proxy_pass http://127.0.0.1:8787/egg;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# The same page with a trailing slash, because people type one and because
# some QR readers add one. Served rather than redirected: a redirect would
# work too, but this is one less round trip on a phone in a car park.
location = /egg/ {
    proxy_pass http://127.0.0.1:8787/egg;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ---------------------------------------------------------------------------
# After reloading, check both from any machine:
#
#     curl -sI https://dx.morabu.com/egg  | head -1    # expect 200
#     curl -sI https://dx.morabu.com/egg/ | head -1    # expect 200
#
# and then open https://dx.morabu.com/egg on a phone and scan the QR from
# the slide itself. The slide is what 171 people will point a camera at, so
# it is the slide that wants testing, not just the address typed by hand.
#
# The old address keeps working. https://dx.morabu.com/pedometer/egg is
# still served and still opens モラエッグ, so anything already bookmarked or
# pasted into a message before the move is not broken by it.
# ---------------------------------------------------------------------------
